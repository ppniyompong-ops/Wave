<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d10"><title>Wave</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside><div class="logo">〰 Wave</div><button id="libraryTab" class="active">คลังเพลง</button><button id="favTab">♥ ที่ชอบ</button><div class="spacer"></div><button id="add">＋ เพิ่มเพลง</button><button id="backup">สำรองข้อมูล</button><button id="restore">กู้คืนข้อมูล</button><input id="files" type="file" accept="audio/*,.lrc" multiple hidden><input id="backupFile" type="file" accept=".json,application/json" hidden></aside>
<main><header><h1 id="heading">คลังเพลง</h1><input id="search" placeholder="ค้นหาเพลงหรือศิลปิน"></header><section id="tracks"></section></main></div>
<footer><div class="now"><strong id="song">ยังไม่ได้เลือกเพลง</strong><small id="artist">เพิ่มเพลงเพื่อเริ่มฟัง</small></div><div class="controls"><div><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></footer>
<audio id="audio"></audio><script src="app.js"></script></body></html>
