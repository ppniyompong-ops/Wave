<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e12">
  <title>Wave — Music Library</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="./" aria-label="Wave home">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10v4M7 6v12M11 3v18M15 7v10M19 10v4M23 8v8"/>
          </svg>
        </span>
        <span class="brand-name">Wave</span>
      </a>

      <div class="sidebar-nav">
        <p class="section-label">LIBRARY</p>
        <button id="libraryTab" class="nav-btn active" type="button" aria-pressed="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v15H5.5A1.5 1.5 0 0 1 4 17.5zM4 7h16M8 4v15"/>
          </svg>
          <span>All tracks</span>
        </button>
        <button id="favTab" class="nav-btn" type="button" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 8.7c0 5.1-8.8 10-8.8 10S3.2 13.8 3.2 8.7A4.2 4.2 0 0 1 11 6.4l1 1 1-1a4.2 4.2 0 0 1 7.8 2.3Z"/>
          </svg>
          <span>Favorites</span>
        </button>
      </div>

      <div class="sidebar-actions">
        <button id="add" class="action-btn primary" type="button" aria-label="Add music">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add music</span>
        </button>
        <button id="backup" class="action-btn" type="button" aria-label="Back up library">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg>
          <span>Back up</span>
        </button>
        <a class="action-btn" href="https://music.youtube.com/search?q=25hours%20%E0%B8%A4%E0%B8%94%E0%B8%B9%E0%B8%81%E0%B8%B2%E0%B8%A5" target="_blank" rel="noopener noreferrer" aria-label="Listen to Ruedu Kan by 25hours on YouTube Music">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>
          <span>Listen online</span>
        </a>
        <button id="restore" class="action-btn" type="button" aria-label="Restore library">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M5 17v4h14v-4"/></svg>
          <span>Restore</span>
        </button>
      </div>

      <input id="files" type="file" accept="audio/*" multiple hidden>
      <input id="backupFile" type="file" accept=".json,application/json" hidden>
      <span class="sidebar-footnote">PRIVATE MUSIC LIBRARY</span>
    </aside>

    <main class="main">
      <header class="page-header">
        <div class="page-heading">
          <p class="eyebrow">YOUR COLLECTION</p>
          <h1 id="heading">Your Library</h1>
          <p class="page-subtitle">Your music, organized in one place.</p>
        </div>
        <label class="search-box">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg>
          <input id="search" type="search" placeholder="Search tracks or artists" autocomplete="off" aria-label="Search tracks or artists">
          <kbd>/</kbd>
        </label>
      </header>
      <section id="tracks" class="track-list" aria-live="polite"></section>
    </main>
  </div>

  <footer class="player" aria-label="Audio player">
    <div class="now-playing">
      <div class="album-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="now-meta">
        <strong id="song">No track selected</strong>
        <small id="artist">Choose a track to start listening</small>
      </div>
    </div>

    <div class="player-center">
      <div class="transport">
        <button id="prev" class="player-btn" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg>
        </button>
        <button id="play" class="play-btn" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
        </button>
        <button id="next" class="player-btn" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6z"/></svg>
        </button>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-control">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4zM17 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"/></svg>
      <input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume">
    </div>
  </footer>

  <div id="notice" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="app.js?v=4"></script>
</body>
</html>
