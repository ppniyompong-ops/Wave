services:
  - type: web
    name: wave-navidrome
    runtime: image
    image:
      url: deluan/navidrome:latest
    region: singapore
    plan: starter
    autoDeployTrigger: off
    disk:
      name: navidrome-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: ND_DATAFOLDER
        value: /data
      - key: ND_MUSICFOLDER
        value: /data/music
      - key: ND_PORT
        value: "10000"
      - key: ND_LOGLEVEL
        value: info
